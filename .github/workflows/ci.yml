name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: make check
        run: make check
      - name: shellcheck
        run: shellcheck scripts/install.sh scripts/release.sh scripts/test-install.sh

  install:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build an unsigned snapshot release
        run: |
          git tag v0.0.0-ci
          status=0
          scripts/release.sh 0.0.0-ci || status=$?
          [ "$status" -eq 3 ] || exit 1   # 3: built and checksummed, not signed
      - name: Install end to end
        run: sudo scripts/test-install.sh dist
