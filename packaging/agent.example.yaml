# AutoHeal agent configuration.
#
# Linux:  /etc/autoheal/agent.yaml
# macOS:  /usr/local/etc/autoheal/agent.yaml
#
# The API address and the credential are not set here. They come from
# `autoheal-agent enroll` and are kept in the state folder.

# Optional. Without it the agent keeps the name given to its enrollment token,
# or else its hostname.
# name: web-01

# Optional. Every check is reported as "<host_prefix>:<name>", so two agents in
# one environment never share an incident. The default is the hostname,
# lowercased, with other characters replaced by "-".
# host_prefix: web-01

# Holds the credential and the spool of events waiting to be sent. It must be
# readable only by the agent's user.
# state_dir: /var/lib/autoheal-agent

# Optional. A PEM file of extra certificate authorities to trust, added to the
# system's own, for an AutoHeal address or checks behind an internal CA.
# ca_file: /etc/ssl/internal-ca.pem

# debug, info, warn or error. Logs go to standard error as JSON.
log_level: info

# Events wait here while AutoHeal cannot be reached. When it is full the oldest
# events are dropped.
spool:
  max_events: 10000
  max_mb: 20

# Host health: CPU, memory and disks, each up, degraded or down by percent used.
host:
  # enabled: false
  interval: 60s
  cpu: { degraded: 85, down: 95 }
  memory: { degraded: 85, down: 95 }
  disks:
    - { name: root, path: /, degraded: 85, down: 95 }

# HTTP and TCP checks, at most 50. Names may hold letters, digits and . _ -,
# up to 59 characters, and must not start with "host.".
#
# A check is down when it fails, degraded when slower than `slow`, and up
# otherwise. A down result is an error unless `down_severity: critical`, which
# makes AutoHeal investigate it automatically and email members.
checks:
  - name: api
    http:
      url: "http://127.0.0.1:8080/health"
      expect_status: [200]
    interval: 30s
    timeout: 5s
    slow: 1s

  - name: postgres
    tcp:
      address: "127.0.0.1:5432"
    interval: 30s
    timeout: 3s

# Recovery (agent 0.2.0 and later), off by default. While it is off the agent
# never asks AutoHeal for tasks.
#
# When it is on, AutoHeal can ask this agent for two actions, and only on the
# targets listed here: run one of the checks above again (recheck_health), or
# send one POST to a cache hook on this host (clear_cache). The agent acts only
# on tasks signed by a key below, and still never starts a process.
#
# Turning it on needs at least one platform key and one action with a target.
#
# recovery:
#   enabled: true
#
#   # The key ID and public key your AutoHeal server printed when its signing
#   # key was generated (`php artisan recovery:generate-signing-key`). Only the
#   # public key belongs here. List two keys while the server's key is rotated.
#   platform_keys:
#     - id: k1
#       public_key: "<base64 Ed25519 public key>"
#
#   actions:
#     # Checks AutoHeal may ask to run again, by the names used in this file
#     # (host checks are "host.cpu", "host.memory" and "host.disk.<name>").
#     recheck_health:
#       checks: [api, postgres]
#
#     # Cache hooks. The URL must be on this host: localhost, 127.0.0.0/8 or
#     # ::1. The agent sends POST with the body {"task_id": "..."}, follows no
#     # redirect and ignores the answer's body; any 2xx status means done.
#     #   token_file  optional; its content is sent as "Authorization: Bearer".
#     #               It must be readable only by the agent's user (chmod 600).
#     #   timeout     30s unless set; at most 120s.
#     clear_cache:
#       hooks:
#         - name: views
#           url: "http://127.0.0.1:8080/internal/cache/clear"
#           token_file: /etc/autoheal/hooks/views.token
#           timeout: 30s
